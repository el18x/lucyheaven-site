<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUCY HEAVEN</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap');
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: 'JetBrains Mono', monospace;
      color: #a64aff; /* Lucy's purple */
      min-height: 100vh;
      background-color: black;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: relative;
      font-size: clamp(16px, 2vw, 20px);
      text-align: center;
    }
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 4rem;
    }
    img.logo {
      display: block;
      margin: 0 auto 0.8rem auto; /* added subtle spacing for readability */
      width: min(80%, 600px);
      height: auto;
      border: none;
      filter: none;
    }
    p.typed-text {
      color: #bbb;
      font-size: clamp(1.8rem, 3vw, 1.5rem);
      white-space: nowrap;
      display: block;
      text-align: center;
      margin: 0.5rem auto 1rem auto; /* increased spacing slightly */
    }
    .section {
      margin: 0.8rem 0; /* slightly larger spacing between sections */
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .section a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #a64aff;
      text-decoration: none;
      margin: 5px auto;
      transition: all 0.2s ease-in-out;
    }
    .section a i {
      margin-right: 8px;
      color: #a64aff;
      transition: transform 0.2s;
    }
    .section a:hover {
      color: white;
      text-shadow: 0 0 8px #a64aff;
    }
    .section a:hover i {
      transform: scale(1.2);
    }
  </style>
</head>
<body>
  <div class="content">
    <img src="lettering (demo) (5).png" alt="Lucy Heaven Sigil" class="logo">
    <p class="typed-text" id="type-target"></p>

    <div class="section">
      <div class="ascii">[MUSIC]</div>
      <a href="https://open.spotify.com/artist/40JpOOsJ5l6ghMsAX6jeEQ" target="_blank"><i class="fab fa-spotify"></i> Spotify</a>
      <a href="https://music.apple.com/us/artist/lucy-heaven/1721824679" target="_blank"><i class="fab fa-apple"></i> Apple Music</a>
      <a href="https://music.youtube.com/channel/UCXB7fuOC2P3j8McYqX63r4Q" target="_blank"><i class="fab fa-youtube"></i> YouTube Music</a>
      <a href="https://music.amazon.com/artists/B0CQJJFBZZ/lucy-heaven" target="_blank"><i class="fab fa-amazon"></i> Amazon Music</a>
      <a href="https://soundcloud.com/lucy-heaven-590501590" target="_blank"><i class="fab fa-soundcloud"></i> SoundCloud</a>
    </div>

    <div class="section">
      <div class="ascii">[SOCIALS]</div>
      <a href="https://www.instagram.com/lucyheaven18/" target="_blank"><i class="fab fa-instagram"></i> Instagram</a>
      <a href="https://x.com/lucyheaven18" target="_blank"><i class="fab fa-x-twitter"></i> Twitter</a>
      <a href="https://www.tiktok.com/@lucyheaven18" target="_blank"><i class="fab fa-tiktok"></i> TikTok</a>
    </div>

    <div class="section">
      <div class="ascii">[MUSIC VIDEOS]</div>
      <a href="https://youtu.be/pkf88Bpdrxg?si=PeBjQyeynvCQQ0UD" target="_blank"><i class="fab fa-youtube"></i> Ugly Thoughts</a>
      <a href="https://youtu.be/axXBLRC3R0I?si=GIoorp2LfNGbkgI5" target="_blank"><i class="fab fa-youtube"></i> I Love Your Tears</a>
      <a href="https://youtu.be/vU6kK2I4_Jg?si=zGScYf8raPtap8ru" target="_blank"><i class="fab fa-youtube"></i> Emo Girl</a>
    </div>
  </div>
</body>
</html>
